name: Publicar Instagram e Facebook

# O cron do GitHub atrasa horas no plano grátis. Por isso cada execução fica ligada até ~5h45
# e confere a fila a cada 5 minutos; o cron só religa o laço (a concorrência deixa uma de cada vez).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só conferir o token (não publica)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            fila
            publicador
      - name: Publicar o que chegou na hora
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TESTE: ${{ inputs.teste && '--teste' || '' }}
        run: |
          git config user.name "publicador-quintal"
          git config user.email "publicador@users.noreply.github.com"
          gravar() {
            git add fila
            if ! git diff --cached --quiet; then
              git commit -q -m "publicador: resultado $(date -u +%FT%TZ)"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
          }
          fim=$((SECONDS + 345*60))
          falhou=0
          while :; do
            git pull -q --rebase origin main || echo "aviso: git pull falhou, sigo com a fila local"
            python3 publicador/publicar.py $TESTE || falhou=1
            gravar
            [ -n "$TESTE" ] && break
            [ $SECONDS -ge $fim ] && break
            sleep 300
          done
          exit $falhou
